---
# -------------------------- Find backup on control node --------------------------

- name: Find latest backup on control node
  delegate_to: control_node
  run_once: true
  ansible.builtin.shell: |
    ls -1t {{ santa_bot_backup_dir }}/santa_bot_*.tar.gz 2>/dev/null | head -n 1 || true
  register: latest_backup
  changed_when: false

- name: Set backup facts
  ansible.builtin.set_fact:
    backup_exists: "{{ latest_backup.stdout | length > 0 }}"
    backup_file: "{{ latest_backup.stdout | basename }}"
  run_once: true

- name: Show selected backup
  ansible.builtin.debug:
    msg: "Selected backup: {{ backup_file }}"
  when: backup_exists

- name: Warn if no backup found
  ansible.builtin.debug:
    msg: "No backups found in {{ santa_bot_backup_dir }}, restore is skipped"
  when: not backup_exists

# -------------------------- Fetch backup --------------------------

- name: Fetch backup from control node
  ansible.builtin.fetch:
    src: "{{ latest_backup.stdout }}"
    dest: "/tmp/"
    flat: true
  delegate_to: control_node
  run_once: true
  when: backup_exists

# -------------------------- Stop container --------------------------

- name: Stop docker compose
  ansible.builtin.shell: docker compose down
  args:
    chdir: "{{ santa_bot_compose_dir }}"
  when: backup_exists

# -------------------------- Extract backup --------------------------

- name: Extract backup
  ansible.builtin.unarchive:
    src: "/tmp/{{ backup_file }}"
    dest: "{{ santa_bot_dir }}/"
    remote_src: false
  when: backup_exists

# -------------------------- Normalize file permissions --------------------------
# The backup tar preserves the modes captured at backup time. If data/*.json
# was ever chmod'ed to 0755 (e.g. by an old role version that applied
# "mode: '0755'" together with "recurse: true"), git sees it as a local
# modification and the next "Clone Santa Bobot repository" task fails with
# "Local modifications exist in the destination". Reset tracked data files to
# their git mode 0644; secrets.json is not in the archive and is written
# separately with 0600 by secrets.yml.

- name: Reset tracked data file permissions
  ansible.builtin.file:
    path: "{{ item }}"
    mode: '0644'
  loop:
    - "{{ santa_bot_dir }}/data/users.json"
    - "{{ santa_bot_dir }}/data/secrets-example.json"
  when: backup_exists

# -------------------------- Restore secrets --------------------------
# The bot token is excluded from backups and is always deployed from
# files/secrets.enc.yml (or the santa_bot_token variable).

- name: Provide bot token (data/secrets.json)
  ansible.builtin.include_role:
    name: santa_bot/config
    tasks_from: secrets.yml
  when: backup_exists

# -------------------------- Start container --------------------------

- name: Start Santa Bobot
  ansible.builtin.shell: docker compose up -d
  args:
    chdir: "{{ santa_bot_compose_dir }}"
  become: true
  become_method: su
  become_user: docker
  when: backup_exists
