# П.2 плана аудита: pre-commit проверка секретов (gitleaks).
# Установка: pip install pre-commit && pre-commit install
# Проверка всего дерева: pre-commit run --all-files
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks
        args: ["--no-git", "--redact", "--config", ".gitleaks.toml"]
