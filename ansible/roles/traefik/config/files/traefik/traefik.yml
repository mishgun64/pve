global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  # Dashboard выведен из эксплуатации: роутер traefik.mishgun.com и
  # basic-auth удалены (dynamic/dashboard.yml). API остаётся доступен только
  # изнутри контейнера/по loopback, наружу не публикуется.
  dashboard: false
  insecure: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: ":443"
#
#  xmpp:
#    address: ":5222"

certificatesResolvers:
  letsencrypt:
    acme:
      email: heimcbk201@gmail.com
      storage: /etc/traefik/acme.json
      dnsChallenge:
        provider: acme-dns
        resolvers:
          - "8.8.8.8:53"
          - "1.1.1.1:53"

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: "INFO"
  filePath: "/var/log/traefik/traefik.log"
accessLog:
  filePath: "/var/log/traefik/access.log"

experimental:
  plugins:
    crowdsec-bouncer-traefik-plugin:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.8.1
