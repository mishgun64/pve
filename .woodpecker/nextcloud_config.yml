when:
  - event: push
    branch: main
    path:
      include:
        - ansible/roles/nextcloud/config/**

  - event: manual
    evaluate: 'PIPELINE == "nextcloud/config"'

steps:
  deploy:
    image: alpine/ansible:latest

    environment:
      SSH_KEY:
        from_secret: ssh_key

    commands:
      - |
        if [ "$CI_PIPELINE_EVENT" = "manual" ]; then
          if [ -z "$ROLE" ]; then
            echo "ERROR: ROLE parameter is required"
            exit 1
          fi

          if [ -z "$TARGET" ]; then
            echo "ERROR: TARGET parameter is required"
            exit 1
          fi
        else
          ROLE="nextcloud/config"
          TARGET="nextcloud_vm"
        fi

        echo "ROLE=$ROLE"
        echo "TARGET=$TARGET"

        apk add --no-cache rsync sops
        sops --version

        mkdir -p ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519

        export ANSIBLE_CONFIG=ansible/ansible.cfg

        # Vault: значения из sops (age-получатель = root SSH-ключ control-node,
        # он же SSH_KEY). Плейнтекст vault.yml в git не попадает.
        SOPS_AGE_SSH_PRIVATE_KEY_FILE="$HOME/.ssh/id_ed25519" \
          sops -d ansible/vault.sops.yml > /tmp/vault.yml
        install -m 0600 /tmp/vault.yml ansible/group_vars/all/vault.yml

        ansible-playbook \
          -i ansible/hosts_prod \
          ansible/run_role.yml \
          -e "role_name=$${ROLE}" \
          -e "target_hosts=$${TARGET}"
