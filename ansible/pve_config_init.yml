---

- name: PVE config
  hosts: pve
  remote_user: root
  gather_facts: false
  # П.2 плана аудита: литеральный ansible_password удалён из репозитория
  # (был в публичной истории). Пароль root на PVE-хостах сменить!
  # Подключение при первом прогоне: --ask-pass (или Ansible Vault),
  # далее — по ключу (roles/pve/config_soft ставит authorized_keys2).
  roles:
    - pve/config_soft
    - pve/config_hard
    - pve/firstboot_clean
    - pve/get_api_token