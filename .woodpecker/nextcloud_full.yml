when:
  - event: manual
    evaluate: 'PIPELINE == "nextcloud/full"'

steps:
  deploy:
    image: alpine/ansible:latest

    environment:
      SSH_KEY:
        from_secret: ssh_key

    commands:
      - |

        apk add --no-cache sops

        mkdir -p ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519

        export ANSIBLE_CONFIG=ansible/ansible.cfg

        # Vault: значения из sops (age-получатель = root SSH-ключ control-node,
        # он же SSH_KEY). Плейнтекст vault.yml в git не попадает.
        SOPS_AGE_SSH_PRIVATE_KEY_FILE="$HOME/.ssh/id_ed25519" \
          sops -d ansible/vault.sops.yml > /tmp/vault.yml
        install -m 0600 /tmp/vault.yml ansible/group_vars/all/vault.yml

        ansible-playbook \
          -i ansible/hosts_prod \
          ansible/nextcloud_config.yml
