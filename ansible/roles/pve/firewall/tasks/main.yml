---

#--------------------------Firewall rules----------------------------------

- name: Decrypt firewall rules locally
  ansible.builtin.command:
    cmd: sops -d {{ role_path }}/files/cluster.fw.enc
  delegate_to: localhost
  register: fw_decrypted
  changed_when: false
  no_log: true

- name: Write firewall rules to pmxcfs
  ansible.builtin.shell:
    cmd: "cat > /etc/pve/firewall/cluster.fw"
    stdin: "{{ fw_decrypted.stdout | replace('\r\n', '\n') }}"
  become: true
  delegate_to: pve
  no_log: true

- name: Convert firewall rules to ASCII
  ansible.builtin.shell: >
    sed -i 's/\r//' /etc/pve/firewall/cluster.fw
  delegate_to: pve
  changed_when: false
