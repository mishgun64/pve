[defaults]
interpreter_python =auto_silent
forks              = 10
timeout            = 30
host_key_checking  = True
callbacks_enabled  = timer, profile_tasks
#verbosity = 4
pipelining = true
#allow_world_readable_tmpfiles = true
[ssh_connection]
# Проверка host key включена (host_key_checking = True): MITM в LAN детектируется.
# Для одноразового bootstrap неизвестных хостов — отдельный флаг/inventory,
# а не отключение проверки глобально (п.6.4 плана аудита).
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey,password
pipelining = true