when:
  - event: manual
    evaluate: 'PIPELINE == "nextcloud/backup"'

  # Плановая задача в настройках репозитория (repo settings -> Crons).
  # Имя должно совпадать с именем cron-задачи, иначе пайплайн пропускается.
  - event: cron
    cron: "Nextcloud-backup"

steps:
  deploy:
    image: alpine/ansible:latest

    environment:
      SSH_KEY:
        from_secret: ssh_key

    commands:
      - |
        if [ "$CI_PIPELINE_EVENT" = "manual" ]; then
          if [ -z "$ROLE" ]; then
            echo "ERROR: ROLE parameter is required"
            exit 1
          fi

          if [ -z "$TARGET" ]; then
            echo "ERROR: TARGET parameter is required"
            exit 1
          fi
        else
          ROLE="nextcloud/backup"
          TARGET="nextcloud_vm"
        fi

        echo "ROLE=$ROLE"
        echo "TARGET=$TARGET"

        apk add --no-cache rsync sops

        mkdir -p ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519

        export ANSIBLE_CONFIG=ansible/ansible.cfg

        # Backups are pulled from the VM into control_node (/srv/backups/nextcloud),
        # so the private key must also be available on that host.
        ansible-playbook \
          -i ansible/hosts_prod \
          ansible/run_role.yml \
          -e "role_name=$${ROLE}" \
          -e "target_hosts=$${TARGET}"
