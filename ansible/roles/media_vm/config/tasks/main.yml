---

#-----------------------Mount vda----------------------------------

- name: Attach LVM volume to VM 124
  ansible.builtin.command: >
    qm set 124 -virtio1 /dev/media_vg/media_lv
  delegate_to: pve

#- name: Get VM disks
#  command: qm config 124
#  register: config
#  changed_when: false
#  delegate_to: pve
#
#- name: Attach disk if not present
#  command: qm set 124 -virtio1 media-vg:media_lv
#  when: config.stdout is not search("media-vg:media_lv")
#  delegate_to: pve

- name: Ensure /media directory exists
  ansible.builtin.file:
    path: /media
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check if filesystem exists on /dev/vda
  ansible.builtin.command: blkid /dev/vda
  register: blkid_result
  failed_when: false
  changed_when: false

- name: Create ext4 filesystem on /dev/vda if missing
  ansible.builtin.filesystem:
    fstype: ext4
    dev: /dev/vda
  when: blkid_result.rc != 0

- name: Mount /dev/vda to /media
  ansible.posix.mount:
    path: /media
    src: /dev/vda
    fstype: ext4
    state: mounted
    opts: defaults

#-----------------------Create folder structure----------------------------------

- name: Create media directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: docker
    group: docker
    mode: "0755"
  loop:
    - /media/torrents
    - /media/torrents/movies
    - /media/torrents/anime
    - /media/torrents/series
    - /media/library
    - /media/library/movies
    - /media/library/anime
    - /media/library/series

#-----------------------Increase inotify max_user_watches----------------------------------

- name: Increase inotify max_user_watches
  ansible.posix.sysctl:
    name: fs.inotify.max_user_watches
    value: '524288'
    state: present
    reload: yes

# ----------------------- Decrypt init config --------------------------

- name: Decrypt encrypted archives
  delegate_to: localhost
  run_once: true
  ansible.builtin.shell: >
    sops -d {{ item.src }} > {{ item.dest }}
  args:
    creates: "{{ item.dest }}"
  environment:
    SOPS_AGE_SSH_PRIVATE_KEY_FILE: /root/.ssh/id_ed25519
  loop:
    - { src: "{{ role_path }}/files/init_config/emby_init_config.tar.gz.enc", dest: "{{ role_path }}/files/init_config/emby_init_config.tar.gz" }
    - { src: "{{ role_path }}/files/init_config/jellyfin_init_config.tar.gz.enc", dest: "{{ role_path }}/files/init_config/jellyfin_init_config.tar.gz" }
    - { src: "{{ role_path }}/files/init_config/prowlarr_init_config.tar.gz.enc", dest: "{{ role_path }}/files/init_config/prowlarr_init_config.tar.gz" }
    - { src: "{{ role_path }}/files/init_config/radarr_init_config.tar.gz.enc", dest: "{{ role_path }}/files/init_config/radarr_init_config.tar.gz" }
    - { src: "{{ role_path }}/files/init_config/seerr_init_config.tar.gz.enc", dest: "{{ role_path }}/files/init_config/seerr_init_config.tar.gz" }
    - { src: "{{ role_path }}/files/init_config/sonarr_anime_init_config.tar.gz.enc", dest: "{{ role_path }}/files/init_config/sonarr_anime_init_config.tar.gz" }
    - { src: "{{ role_path }}/files/init_config/sonarr_series_init_config.tar.gz.enc", dest: "{{ role_path }}/files/init_config/sonarr_series_init_config.tar.gz" }

- name: Create directories for docker services
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: docker
    group: docker
    mode: "0755"
  loop:
    - /home/docker/prowlarr_config
    - /home/docker/sonarr_anime_config
    - /home/docker/sonarr_series_config
    - /home/docker/radarr_config
    - /home/docker/bazarr_config
    - /home/docker/qbittorrent_config
    - /home/docker/seerr_config
    - /home/docker/jellyfin_config
    - /home/docker/emby_config

- name: Copy archives
  copy:
    src: "{{ item }}"
    dest: /home/docker/init_config/
  loop:
    - init_config/emby_init_config.tar.gz
    - init_config/jellyfin_init_config.tar.gz
    - init_config/prowlarr_init_config.tar.gz
    - init_config/radarr_init_config.tar.gz
    - init_config/seerr_init_config.tar.gz
    - init_config/sonarr_anime_init_config.tar.gz
    - init_config/sonarr_series_init_config.tar.gz

- name: Extract archives
  unarchive:
    src: "{{ item }}"
    dest: /home/docker/
    owner: docker
    group: docker
    mode: "0755"
    remote_src: yes
  loop:
    - /home/docker/init_config/emby_init_config.tar.gz
    - /home/docker/init_config/jellyfin_init_config.tar.gz
    - /home/docker/init_config/prowlarr_init_config.tar.gz
    - /home/docker/init_config/radarr_init_config.tar.gz
    - /home/docker/init_config/seerr_init_config.tar.gz
    - /home/docker/init_config/sonarr_anime_init_config.tar.gz
    - /home/docker/init_config/sonarr_series_init_config.tar.gz

- name: Ensure qbittorrent config dir exists
  file:
    path: /home/docker/qbittorrent_config/config
    state: directory
    owner: docker
    group: docker
    mode: '0755'

- name: Copy qbittorrent configs
  copy:
    src: "{{ item }}"
    dest: /home/docker/qbittorrent_config/config/
    owner: docker
    group: docker
    mode: '0644'
  loop:
    - init_config/qbittorrent/categories.json
    - init_config/qbittorrent/qBittorrent.conf

- name: Remove init_config directory
  file:
    path: /home/docker/init_config
    state: absent

- name: Copy docker-compose file
  ansible.builtin.copy:
    src: docker-compose.yml
    dest: /home/docker/docker-compose.yml
    owner: docker
    group: docker
    mode: "0644"

#-----------------------Install Vuetorrent----------------------------------

- name: Clone VueTorrent repository
  git:
    repo: https://github.com/VueTorrent/VueTorrent.git
    dest: /home/docker/VueTorrent
    version: latest-release
    single_branch: yes
    update: yes
    force: yes
  become: true
  become_user: docker


#-----------------------Auto updates----------------------------------

- name: Update VueTorrent via cron
  cron:
    name: "VueTorrent update"
    minute: "30"
    hour: "6"
    job: >
      cd /home/docker/VueTorrent &&
      git pull

#--------------------------Firewall rules----------------------------------

- name: Decrypt locally
  ansible.builtin.command:
    cmd: sops -d {{ playbook_dir }}/roles/media_vm/config_soft/files/124.fw.enc
  delegate_to: localhost
  register: fw_decrypted
  changed_when: false
#  no_log: true

- name: Write to pmxcfs
  ansible.builtin.shell:
    cmd: "cat > /etc/pve/firewall/124.fw"
    stdin: "{{ fw_decrypted.stdout | replace('\r\n', '\n') }}"
  delegate_to: pve
  no_log: true

- name: Convert rules to ASCII
  ansible.builtin.shell: >
    sed -i 's/\r//' /etc/pve/firewall/124.fw
  delegate_to: pve

