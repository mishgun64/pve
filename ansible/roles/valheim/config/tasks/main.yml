    # python3 -c "import crypt; print(crypt.crypt('pass', crypt.mksalt(crypt.METHOD_SHA512)))"

- name: Set shell for docker user
  user:
    name: docker
    shell: /bin/bash

#--------------------------Firewall rules----------------------------------

- name: Decrypt locally
  ansible.builtin.command:
    cmd: sops -d {{ role_path }}/files/124.fw.enc
  delegate_to: localhost
  register: fw_decrypted
  changed_when: false
  no_log: true

- name: Write to pmxcfs
  ansible.builtin.shell:
    cmd: "cat > /etc/pve/firewall/124.fw"
    stdin: "{{ fw_decrypted.stdout | replace('\r\n', '\n') }}"
  delegate_to: pve
  no_log: true


- name: Convert to ASCII
  ansible.builtin.shell: >
    sed -i 's/\r//' /etc/pve/firewall/146.fw
  delegate_to: pve

#--------------------------Copy Valheim config files----------------------------------

- name: Create required directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: 1001
    group: 1001
    mode: '0755'
  loop:
    - /home/docker/config
    - /home/docker/data

- name: Copy docker-compose.yml
  copy:
    src: docker-compose.yml
    dest: /home/docker/docker-compose.yml
    owner: docker
    group: docker
    mode: '0644'

#------------------------------------------Start container------------------------------------------

- name: Start docker compose
  ansible.builtin.shell: docker compose up -d
  args:
    chdir: /home/docker
  become: true
  become_user: docker

