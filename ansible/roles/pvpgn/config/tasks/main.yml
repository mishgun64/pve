---

#--------------------------User settings----------------------------------

- name: Change root password
  ansible.builtin.user:
    name: root
    password: '{{ vault_pvpgn_root_password_hash | mandatory }}'  # значение из ansible-vault (group_vars/all/vault.yml); хеш НЕ коммитить в репозиторий
    # python3 -c "import crypt; print(crypt.crypt('pass', crypt.mksalt(crypt.METHOD_SHA512)))"

- name: Set shell for docker user
  user:
    name: docker
    shell: /bin/bash

#--------------------------Copy PVPGN config files----------------------------------

- name: Create required directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: 1001
    group: 1001
    mode: '0755'
  loop:
    - /home/docker/pvpgn_conf
    - /home/docker/pvpgn_var/files
    - /home/docker/pvpgn_var/status
    - /home/docker/pvpgn_var/ladders
    - /home/docker/db

- name: Copy bnetd.conf
  copy:
    src: bnetd.conf
    dest: /home/docker/pvpgn_conf/bnetd.conf
    owner: 1001
    group: 1001
    mode: '0644'

- name: Copy support files
  copy:
    src: support/
    dest: /home/docker/pvpgn_var/files/
    owner: 1001
    group: 1001
    mode: '0644'

- name: Copy docker-compose.yml
  copy:
    src: docker-compose.yml
    dest: /home/docker/docker-compose.yml
    owner: docker
    group: docker
    mode: '0644'

# -------------------------- Apply container changes--------------------------

- name: Start docker compose
  ansible.builtin.shell: docker compose up -d
  args:
    chdir: /home/docker
  become: true
  become_method: su
  become_user: docker

