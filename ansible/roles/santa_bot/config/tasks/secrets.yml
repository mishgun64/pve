---

#--------------------------Bot secret data----------------------------------
# Included by both santa_bot/config and santa_bot/restore, because the token
# is intentionally excluded from backups.

- name: Check for encrypted secrets file
  ansible.builtin.stat:
    path: "{{ role_path }}/files/secrets.enc.yml"
  delegate_to: localhost
  register: santa_bot_secrets_file

- name: Decrypt secrets file
  ansible.builtin.command:
    cmd: sops -d {{ role_path }}/files/secrets.enc.yml
  delegate_to: localhost
  register: santa_bot_secrets_raw
  changed_when: false
  no_log: true
  when: santa_bot_secrets_file.stat.exists

- name: Set bot token from encrypted secrets
  ansible.builtin.set_fact:
    santa_bot_token: "{{ (santa_bot_secrets_raw.stdout | from_yaml).santa_bot_token }}"
  no_log: true
  when: santa_bot_secrets_file.stat.exists

- name: Validate bot token
  ansible.builtin.fail:
    msg: >-
      Santa Bobot token is not set. Define the santa_bot_token variable
      (or add files/secrets.enc.yml with the santa_bot_token key to the role).
  when: santa_bot_token | default('') | length == 0

- name: Ensure bot data directory is owned by docker user
  ansible.builtin.file:
    path: "{{ santa_bot_dir }}/data"
    state: directory
    owner: docker
    group: docker
    recurse: true
    mode: '0755'

- name: Ensure bot directory is owned by docker user
  ansible.builtin.file:
    path: "{{ santa_bot_dir }}"
    state: directory
    owner: docker
    group: docker
    mode: '0755'

- name: Write data/secrets.json
  ansible.builtin.copy:
    content: |
      {{ { 'Santa_Bobot': santa_bot_token } | to_json }}
    dest: "{{ santa_bot_dir }}/data/secrets.json"
    owner: docker
    group: docker
    mode: '0600'
  no_log: true
