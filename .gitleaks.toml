# Конфиг gitleaks (п.2 плана аудита).
# Зашифрованные sops-файлы (*.enc, *.enc.yml) — норма: содержимое шифруется
# age. Ротировать/проверять нужно только расшифрованные артефакты.
[extend]
useDefault = true

[allowlist]
description = "sops-артефакты, шаблоны и медиа-архивы"
paths = [
  '''(?i)\.enc(\.yml)?$''',
  '''(?i)\.tar\.gz(\.enc)?$''',
  '''(?i)/\.sops\.ya?ml$''',
  '''(?i)vault\.yml\.example$''',
  '''(?i)\.png$''',
  '''(?i)\.iso$''',
]
# Слова, дающие ложные срабатывания в дефолтных правилах
stopwords = []
