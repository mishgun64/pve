---

#--------------------------Секреты (sops/age)--------------------------
# Файл зашифрован на публичный SSH-ключ jenkins@control (тот же age-получатель,
# что в остальных *.enc репозитория). Плейнтекст в git не попадает.
#
# Заполнить/поменять значения (НЕ в чате и не в задаче CI):
#   sops ansible/roles/monitoring/server/files/secrets.enc.yml
# Ключи:
#   monitoring_grafana_admin_password            — сгенерирован, менять не обязательно
#   monitoring_alertmanager_telegram_bot_token   — @BotFather (бот @pve_mg_monitoring_bot)
#   monitoring_alertmanager_telegram_chat_id     — chat_id получателя/группы (число)
#   monitoring_pve_api_user / token_name / token_value — read-only PVE API-токен

- name: Check for encrypted monitoring secrets
  ansible.builtin.stat:
    path: "{{ role_path }}/files/secrets.enc.yml"
  delegate_to: localhost
  register: monitoring_secrets_file

- name: Fail when monitoring secrets file is missing
  ansible.builtin.fail:
    msg: >-
      Не найден {{ role_path }}/files/secrets.enc.yml. Создать:
      sops --encrypt --age '<jenkins@control public key>' secrets.yml
      > secrets.enc.yml (см. README роли, раздел «Секреты»).
  when: not monitoring_secrets_file.stat.exists

- name: Decrypt monitoring secrets
  block:
    - name: Decrypt monitoring secrets
      ansible.builtin.command:
        cmd: "sops -d {{ role_path }}/files/secrets.enc.yml"
      delegate_to: localhost
      register: monitoring_secrets_raw
      changed_when: false
      no_log: true
  rescue:
    - name: Report sops decryption failure
      ansible.builtin.fail:
        msg: >-
          sops не смог расшифровать {{ role_path }}/files/secrets.enc.yml.
          Нужен приватный ключ jenkins@control: в CI он приходит из секрета
          ssh_key в ~/.ssh/id_ed25519, и пайплайн выставляет
          SOPS_AGE_SSH_PRIVATE_KEY_FILE. При локальном запуске:
          export SOPS_AGE_SSH_PRIVATE_KEY_FILE=/path/to/id_ed25519

- name: Load monitoring secrets
  ansible.builtin.set_fact:
    monitoring_grafana_admin_password: "{{ (monitoring_secrets_raw.stdout | from_yaml)['monitoring_grafana_admin_password'] | default('') }}"
    monitoring_alertmanager_telegram_bot_token: "{{ (monitoring_secrets_raw.stdout | from_yaml)['monitoring_alertmanager_telegram_bot_token'] | default('') }}"
    monitoring_alertmanager_telegram_chat_id: "{{ (monitoring_secrets_raw.stdout | from_yaml)['monitoring_alertmanager_telegram_chat_id'] | default(0) }}"
    monitoring_pve_api_user: "{{ (monitoring_secrets_raw.stdout | from_yaml)['monitoring_pve_api_user'] | default('') }}"
    monitoring_pve_token_name: "{{ (monitoring_secrets_raw.stdout | from_yaml)['monitoring_pve_token_name'] | default('') }}"
    monitoring_pve_token_value: "{{ (monitoring_secrets_raw.stdout | from_yaml)['monitoring_pve_token_value'] | default('') }}"
  no_log: true

# Проверяем только «заполнено/не заглушка» — значения в вывод не попадают.
- name: Validate monitoring secrets
  ansible.builtin.assert:
    that:
      - monitoring_grafana_admin_password | length >= 16
      - monitoring_alertmanager_telegram_bot_token | length > 20
      - monitoring_alertmanager_telegram_bot_token != 'CHANGE_ME'
      - monitoring_alertmanager_telegram_chat_id | int != 0
      - monitoring_pve_api_user | length > 0
      - monitoring_pve_token_name | length > 0
      - monitoring_pve_token_value != 'CHANGE_ME'
      - monitoring_pve_token_value | length > 10
    fail_msg: >-
      В files/secrets.enc.yml остались заглушки CHANGE_ME (или пустые ключи).
      Заполнить: sops {{ role_path }}/files/secrets.enc.yml —
      telegram_bot_token (бот @pve_mg_monitoring_bot), telegram_chat_id,
      pve_token_value (read-only токен monitoring@pve!prometheus).
      Значения в чат/CI не передавать.
    quiet: true