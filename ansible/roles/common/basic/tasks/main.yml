---

#-----------------------Set timezone----------------------------------

- name: Set Europe/Moscow timezone
  ansible.builtin.shell: timedatectl set-timezone Europe/Moscow

#-----------------------Change sshd config----------------------------------

- name: Change sshd config
  ansible.builtin.copy:
    src: sshd_config
    dest: /etc/ssh/sshd_config

- name: Copy control ssh key
  ansible.builtin.copy:
    src: authorized_keys2
    dest: /root/.ssh/
    owner: root
    group: root
    mode: '0600'

- name: Disable and stop ssh.socket
  systemd:
    name: ssh.socket
    enabled: false
    state: stopped

- name: Restart ssh
  systemd:
    name: ssh
    state: restarted
    enabled: true

- name: Wait for SSH to come back
  wait_for:
    port: 22
    delay: 2
    timeout: 30

#-----------------------Update and upgrade----------------------------------

- name: Disable IPv6
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    state: present
    sysctl_set: true
    reload: true
  loop:
    - net.ipv6.conf.all.disable_ipv6
    - net.ipv6.conf.default.disable_ipv6

- name: Update repo and upgrade packages
  ansible.builtin.apt:
    name: '*'
    state: latest
    update_cache: yes

#-----------------------Install packages----------------------------------

- name: Install apt packages
  ansible.builtin.apt:
    name:
      - neovim
      - cron
      - zip
      - unzip
      - htop
      - rsync
    state: latest

- name: Install sops binary
  get_url:
    url: https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
    dest: /usr/local/bin/sops
    mode: '0755'
    owner: root
    group: root

#-----------------------Copy .bashrc----------------------------------

- name: Copy .bashrc
  ansible.builtin.copy:
    src: .bashrc
    dest: /root/.bashrc

#-----------------------Scheduled update----------------------------------

# П.7 плана аудита: noninteractive + force-confold (иначе cron зависает на
# вопросе debconf), лог результата, проверка необходимости перезагрузки.
# Политика обновления: apt upgrade (unattended-upgrades не используется).
- name: System update via cron
  cron:
    name: "APT update and cleanup"
    minute: "20"
    hour: "6"
    job: >-
      { DEBIAN_FRONTEND=noninteractive apt-get update -q &&
      DEBIAN_FRONTEND=noninteractive apt-get upgrade -y -q
      -o Dpkg::Options::="--force-confold" &&
      DEBIAN_FRONTEND=noninteractive apt-get autoremove -y -q &&
      apt-get autoclean -q;
      newest_kernel=$(ls -1 /lib/modules 2>/dev/null | sort -V | tail -1);
      [ "$(uname -r)" = "$newest_kernel" ] ||
      echo "REBOOT REQUIRED: running $(uname -r), newest installed $newest_kernel"; }
      >> /var/log/apt-upgrade.log 2>&1