# Аудит 2026-11-19: ротация логов Traefik (access.log рос до 439 МБ без ротации).
# copytruncate: traefik/crowdsec держат fd открытым, reopen не поддерживается.
/home/docker/traefik/logs/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su root root
}
