when:
  - event: push
    branch: main
    path:
      include:
        - ansible/roles/monitoring/server/**

  - event: manual
    evaluate: 'PIPELINE == "monitoring/server"'

steps:
  deploy:
    image: alpine/ansible:latest

    environment:
      SSH_KEY:
        from_secret: ssh_key

    commands:
      - |
        if [ "$CI_PIPELINE_EVENT" = "manual" ]; then
          if [ -z "$ROLE" ]; then
            echo "ERROR: ROLE parameter is required"
            exit 1
          fi

          if [ -z "$TARGET" ]; then
            echo "ERROR: TARGET parameter is required"
            exit 1
          fi
        else
          ROLE="monitoring/server"
          TARGET="monitoring_server"
        fi

        echo "ROLE=$ROLE"
        echo "TARGET=$TARGET"

        apk add --no-cache sops
        sops --version

        mkdir -p ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519

        export ANSIBLE_CONFIG=ansible/ansible.cfg

        # Роль расшифровывает files/secrets.enc.yml на localhost (CI):
        # приватный ключ jenkins@control = тот же SSH_KEY.
        export SOPS_AGE_SSH_PRIVATE_KEY_FILE="$HOME/.ssh/id_ed25519"

        ansible-playbook \
          -i ansible/hosts_prod \
          ansible/run_role.yml \
          -e "role_name=$${ROLE}" \
          -e "target_hosts=$${TARGET}"