---

#-----------------------User settings----------------------------------

- name: Change root password
  ansible.builtin.user:
    name: root
    password: '{{ vault_traefik_root_password_hash | mandatory }}'  # значение из ansible-vault (group_vars/all/vault.yml); хеш НЕ коммитить в репозиторий
    # python3 -c "import crypt; print(crypt.crypt('pass', crypt.mksalt(crypt.METHOD_SHA512)))"

- name: Set shell for docker user
  user:
    name: docker
    shell: /bin/bash

# Проверяем ДО любых изменений на хосте: без хеша пароля Authelia
# users_database не отрендерится, а piweb.yml уже будет ссылаться на
# middleware authelia -> pi.mishgun.com останется недоступным.
- name: Require authelia password hash in vault
  ansible.builtin.assert:
    that:
      - vault_authelia_pi_password_hash is defined
      - vault_authelia_pi_password_hash | length > 0
      - vault_authelia_pi_password_hash != 'CHANGE_ME'
      - vault_authelia_pi_password_hash.startswith('$argon2')
    fail_msg: >-
      Не задан vault_authelia_pi_password_hash (argon2id-хеш пароля Authelia).
      Сгенерировать: docker run --rm authelia/authelia:4.39 authelia crypto
      hash generate argon2 --password 'ПАРОЛЬ'; добавить в
      ansible/group_vars/all/vault.yml и перешифровать в vault.sops.yml.
    quiet: true

#-----------------------Copy config files----------------------------------

- name: Remove old dynamic routes
  ansible.builtin.file:
    path: /home/docker/traefik/dynamic
    state: absent
  # чтобы маршруты, удалённые из репозитория, не оставались на хосте

- name: Copy traefik directory
  copy:
    src: traefik/
    dest: /home/docker/traefik/
    owner: docker
    group: docker
    mode: '0755'
  register: traefik_config_files

- name: Create required directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: docker
    group: docker
    mode: '0755'
  loop:
    - /home/docker/traefik/logs
    - /home/docker/crowdsec/data
    - /home/docker/crowdsec/config
    - /home/docker/acme-dns/config
    - /home/docker/acme-dns/data
    - /home/docker/certs/traefik
    - /home/docker/certs/dumped-certs

#-----------------------Authelia (2FA периметра)----------------------------------

- name: Create authelia directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: docker
    group: docker
    mode: "{{ item.mode }}"
  loop:
    - { path: /home/docker/authelia, mode: '0755' }
    # секреты (jwt/session/storage) — только владельцу
    - { path: /home/docker/authelia/secrets, mode: '0700' }

# force: false — файл создаётся один раз; при повторном прогоне значение
# сохраняется (иначе разломается sqlite-хранилище Authelia).
- name: Generate authelia secrets
  ansible.builtin.copy:
    content: "{{ lookup('password', '/dev/null length=64 chars=ascii_letters,digits') }}\n"
    dest: "/home/docker/authelia/secrets/{{ item }}"
    owner: docker
    group: docker
    mode: '0600'
    force: false
  loop:
    - session_secret
    - storage_encryption_key
    - reset_password_jwt_secret

- name: Copy authelia configuration
  ansible.builtin.copy:
    src: authelia/
    dest: /home/docker/authelia/
    owner: docker
    group: docker
    mode: '0644'
  register: authelia_config_files

# Пароль пользователя pi живёт только в vault (argon2id-хеш).
- name: Render authelia users database
  ansible.builtin.template:
    src: authelia/users_database.yml.j2
    dest: /home/docker/authelia/users_database.yml
    owner: docker
    group: docker
    mode: '0600'
  register: authelia_users_database

- name: Copy acquis.yaml
  copy:
    src: crowdsec/acquis.yaml
    dest: /home/docker/crowdsec/acquis.yaml
    owner: docker
    group: docker
    mode: '0644'

# Аудит 2026-11-19: ротация логов traefik (access.log рос без ротации до 439 МБ).
- name: Ensure logrotate installed
  ansible.builtin.apt:
    name: logrotate
    state: present

- name: Install logrotate config for traefik logs
  copy:
    src: logrotate-traefik.conf
    dest: /etc/logrotate.d/traefik
    owner: root
    group: root
    mode: '0644'

- name: Copy acme-dns config
  copy:
    src: acme-dns/config.cfg
    dest: /home/docker/acme-dns/config/config.cfg
    owner: docker
    group: docker
    mode: '0644'

- name: Create acme.json
  ansible.builtin.file:
    path: /home/docker/certs/traefik/acme.json
    state: touch
    owner: docker
    group: docker
    mode: '0600'

- name: Copy docker-compose.yml
  copy:
    src: docker-compose.yml
    dest: /home/docker/docker-compose.yml
    owner: docker
    group: docker
    mode: '0644'
  register: traefik_compose_file

#-----------------------Add mount point----------------------------------

- name: Add mount point to container 143
  ansible.builtin.command: >
    pct set 143 -mp0 /srv/certs/,mp=/home/docker/certs
  delegate_to: pve

#-----------------------Apply container changes----------------------------------

# Пересоздаём контейнеры, чтобы они подхватили новые конфиги и не держали
# в памяти прежние роуты/сертификаты (file-provider watch обновляет правила,
# но не окружение/mount'ы контейнера). Выполняется только при изменении
# конфигов, чтобы не рвать соединения на пустом прогоне.
- name: Recreate docker compose stack
  ansible.builtin.command: docker compose up -d --force-recreate --remove-orphans
  args:
    chdir: /home/docker
  become: true
  become_method: su
  become_user: docker
  when: >-
    traefik_config_files.changed or
    traefik_compose_file.changed or
    authelia_config_files.changed or
    authelia_users_database.changed
  register: traefik_compose_up
  changed_when: >-
    traefik_compose_up.stderr is defined and
    ('Started' in traefik_compose_up.stderr or
     'Recreated' in traefik_compose_up.stderr or
     'Created' in traefik_compose_up.stderr)

# Authelia падает на невалидном configuration.yml (лишний/удалённый ключ),
# а Traefik в этом случае отдаёт на login.mishgun.com голый 502/504. У образа
# есть HEALTHCHECK (интервал 30s, start-period 1m), поэтому ждём именно
# healthy: при крэш-лупе контейнер на мгновение бывает running.
- name: Wait for authelia to become healthy
  ansible.builtin.command: >-
    docker inspect --format '{{ '{{' }}.State.Status{{ '}}' }}/{{ '{{' }}.State.Health.Status{{ '}}' }}' authelia
  become: true
  become_method: su
  become_user: docker
  register: authelia_state
  changed_when: false
  failed_when: false
  retries: 24
  delay: 5
  until: authelia_state.stdout is match('^running/healthy')

- name: Fail with authelia logs when it is not healthy
  when: authelia_state.stdout is not match('^running/healthy')
  block:
    - name: Collect authelia logs
      ansible.builtin.command: docker logs authelia --tail 40
      become: true
      become_method: su
      become_user: docker
      register: authelia_logs
      changed_when: false
      failed_when: false

    - name: Report authelia startup failure
      ansible.builtin.fail:
        msg: >-
          Контейнер authelia не healthy (status/health: {{ authelia_state.stdout | default('нет контейнера', true) }}).
          Traefik на login.mishgun.com отдаёт 502/504. Логи: {{ authelia_logs.stdout }}
          {{ authelia_logs.stderr }}

#-----------------------Autoupdate Crowdsec hub----------------------------------
- name: Update and upgrade CrowdSec hub daily
  ansible.builtin.cron:
    name: "Crowdsec hub update/upgrade"
    minute: "0"
    hour: "3"
    job: "docker exec crowdsec cscli hub update && docker exec crowdsec cscli hub upgrade"