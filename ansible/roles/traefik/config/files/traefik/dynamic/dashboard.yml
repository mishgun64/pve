---

http:
  routers:
    dashboard:
      rule: "Host(`traefik.mishgun.com`)"
      entryPoints:
        - websecure
      tls: {}
      service: api@internal
      middlewares:
        - auth
        - crowdsec

  middlewares:
    auth:
      basicAuth:
        # Хеш из ansible-vault (group_vars/all/vault.yml, vault_traefik_dashboard_basic_auth).
        # Старый хеш (admin:$apr1$...) был в публичной истории git — считать скомпрометированным,
        # обязательно сменить и сгенерировать новый: htpasswd -nBC 10 '' 'новый-пароль'
        users:
          - "{{ vault_traefik_dashboard_basic_auth | mandatory }}"