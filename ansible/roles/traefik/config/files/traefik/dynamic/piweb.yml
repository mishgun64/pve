---

# Pi Web (control node, 192.168.2.200) — браузерный UI pi coding agent.
# Приложение по своей природе = удалённый shell, поэтому наружу отдаём его
# только через TLS + CrowdSec + лимиты, а сам порт закрыт nftables на control.
http:
  middlewares:
    # П.1 плана аудита: Next.js пропускает middleware при заголовке
    # x-prerender-revalidate = previewModeId из .next/prerender-manifest.json
    # (опубликован в npm-тарболе). Гасим оба заголовка на периметре —
    # middleware стоит ПЕРВЫМ в списке роутера piweb.
    piweb-strip-preview:
      headers:
        customRequestHeaders:
          x-prerender-revalidate: ""
          x-prerender-revalidate-if-generated: ""
    piweb-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        customFrameOptionsValue: "DENY"
        contentTypeNosniff: true
        referrerPolicy: "no-referrer"
        permissionsPolicy: "geolocation=(), microphone=(), camera=()"
        # П.7 плана аудита: CSP и скрытие стека (x-powered-by: Next.js).
        # script-src 'unsafe-inline' нужен Next.js (инлайн-гидратация);
        # при усилении — nonce/hash через next.config.
        contentSecurityPolicy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
        customResponseHeaders:
          X-Powered-By: ""
    piweb-ratelimit:
      rateLimit:
        average: 10
        burst: 20
    # Аудит 2026-11-19: жёсткий лимит на эндпоинт логина (брутфорс пароля).
    piweb-login-ratelimit:
      rateLimit:
        average: 1
        burst: 5
    piweb-inflight:
      inFlightReq:
        amount: 30

  routers:
    # Аудит 2026-11-19: отдельный роутер для логина с жёстким rate-limit.
    piweb-login:
      rule: "Host(`pi.mishgun.com`) && Path(`/api/login`)"
      priority: 100
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      middlewares:
        - piweb-strip-preview
        - crowdsec@file
        - piweb-headers
        - piweb-login-ratelimit
        - piweb-inflight
      service: piweb
    piweb:
      rule: "Host(`pi.mishgun.com`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      middlewares:
        - piweb-strip-preview
        - crowdsec@file
        - piweb-headers
        - piweb-ratelimit
        - piweb-inflight
      service: piweb

  services:
    piweb:
      loadBalancer:
        servers:
          - url: "http://192.168.2.200:30141"
