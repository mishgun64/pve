---

#-----------------------Mount vda----------------------------------

- name: Attach LVM volume to VM 124
  ansible.builtin.command: >
    qm set 124 -virtio1 /dev/media_vg/media_lv
  delegate_to: pve

#- name: Get VM disks
#  command: qm config 124
#  register: config
#  changed_when: false
#  delegate_to: pve
#
#- name: Attach disk if not present
#  command: qm set 124 -virtio1 media-vg:media_lv
#  when: config.stdout is not search("media-vg:media_lv")
#  delegate_to: pve

- name: Ensure /media directory exists
  ansible.builtin.file:
    path: /media
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check if filesystem exists on /dev/vda
  ansible.builtin.command: blkid /dev/vda
  register: blkid_result
  failed_when: false
  changed_when: false

- name: Create ext4 filesystem on /dev/vda if missing
  ansible.builtin.filesystem:
    fstype: ext4
    dev: /dev/vda
  when: blkid_result.rc != 0

- name: Mount /dev/vda to /media
  ansible.posix.mount:
    path: /media
    src: /dev/vda
    fstype: ext4
    state: mounted
    opts: defaults

#-----------------------Create folder structure----------------------------------

- name: Stop docker compose stack
  ansible.builtin.shell: docker compose down
  args:
    chdir: /home/docker

- name: Create media directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: docker
    group: docker
    mode: "0755"
  loop:
    - /media/torrents
    - /media/torrents/movies
    - /media/torrents/anime
    - /media/torrents/series
    - /media/library
    - /media/library/movies
    - /media/library/anime
    - /media/library/series

#-----------------------Increase inotify max_user_watches----------------------------------

- name: Increase inotify max_user_watches
  ansible.posix.sysctl:
    name: fs.inotify.max_user_watches
    value: '524288'
    state: present
    reload: yes

# ----------------------- Init config (decrypt: роль media_vm/init_config) --------------------------

# Архивы расшифровываются ролью media_vm/init_config (только в media.yml / пайплайн media/full).
# При запуске без этой роли (ROLE="media_vm/config" через run_role.yml) шаги копирования/распаковки пропускаются.
- name: Find decrypted init config archives on control node
  ansible.builtin.find:
    paths: "{{ media_vm_init_config_dir }}"
    patterns: "*_init_config.tar.gz"
    file_type: file
  delegate_to: localhost
  run_once: true
  register: media_vm_init_config_found

- name: Set list of decrypted init config archives
  ansible.builtin.set_fact:
    media_vm_init_configs: >-
      {{ media_vm_init_config_found.files | map(attribute='path') | map('basename') | sort | list }}

- name: Warn about missing decrypted init configs
  ansible.builtin.debug:
    msg: >-
      Расшифрованные архивы init_config не найдены в {{ media_vm_init_config_dir }}:
      шаги копирования и распаковки стартовых конфигов пропущены.
      Запустите плейбук ansible/media.yml (пайплайн media/full) - роль media_vm/init_config
      расшифрует архивы.
  when: media_vm_init_configs | length == 0

- name: Create directories for docker services
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: docker
    group: docker
    mode: "0755"
  loop:
    - /home/docker/prowlarr_config
    - /home/docker/sonarr_anime_config
    - /home/docker/sonarr_series_config
    - /home/docker/radarr_config
    - /home/docker/bazarr_config
    - /home/docker/qbittorrent_config
    - /home/docker/seerr_config
    - /home/docker/jellyfin_config
    - /home/docker/emby_config

- name: Copy archives
  copy:
    src: "{{ media_vm_init_config_dir }}/{{ item }}"
    dest: /home/docker/init_config/
    mode: "0644"
  loop: "{{ media_vm_init_configs }}"

- name: Extract archives
  unarchive:
    src: "/home/docker/init_config/{{ item }}"
    dest: /home/docker/
    owner: docker
    group: docker
    mode: "0755"
    remote_src: yes
  loop: "{{ media_vm_init_configs }}"

- name: Ensure qbittorrent config dir exists
  file:
    path: /home/docker/qbittorrent_config/config
    state: directory
    owner: docker
    group: docker
    mode: '0755'

- name: Copy qbittorrent configs
  copy:
    src: "{{ item }}"
    dest: /home/docker/qbittorrent_config/config/
    owner: docker
    group: docker
    mode: '0644'
  loop:
    - init_config/qbittorrent/categories.json
    - init_config/qbittorrent/qBittorrent.conf

- name: Remove init_config directory
  file:
    path: /home/docker/init_config
    state: absent
  when: media_vm_init_configs | length > 0

- name: Copy docker-compose file
  ansible.builtin.copy:
    src: docker-compose.yml
    dest: /home/docker/docker-compose.yml
    owner: docker
    group: docker
    mode: "0644"

#-----------------------Install Vuetorrent----------------------------------

- name: Clone VueTorrent repository
  git:
    repo: https://github.com/VueTorrent/VueTorrent.git
    dest: /home/docker/VueTorrent
    version: latest-release
    single_branch: yes
    update: yes
    force: yes
  become: true
  become_user: docker


#-----------------------Auto updates----------------------------------

- name: Update VueTorrent via cron
  cron:
    name: "VueTorrent update"
    minute: "30"
    hour: "6"
    job: >
      cd /home/docker/VueTorrent &&
      git pull

#-----------------------Change root password----------------------------------

- name: Change root password
  ansible.builtin.user:
    name: root
    password: '{{ vault_media_vm_root_password_hash | mandatory }}'  # значение из ansible-vault (group_vars/all/vault.yml); хеш НЕ коммитить в репозиторий
    # python3 -c "import crypt; print(crypt.crypt('pass', crypt.mksalt(crypt.METHOD_SHA512)))"

