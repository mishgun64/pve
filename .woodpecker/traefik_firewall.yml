when:
  - event: push
    branch: main
    path:
      include:
        - ansible/roles/traefik/firewall/**

  - event: manual
    evaluate: 'PIPELINE == "traefik/firewall"'

steps:
  deploy:
    image: alpine/ansible:latest

    environment:
      SSH_KEY:
        from_secret: ssh_key

    commands:
      - |
        ROLE="$${ROLE:-traefik/firewall}"
        TARGET="$${TARGET:-pve}"

        echo "ROLE=$ROLE"
        echo "TARGET=$TARGET"

        apk add --no-cache sops
        sops --version

        mkdir -p ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519

        export ANSIBLE_CONFIG=ansible/ansible.cfg

        ansible-playbook \
          -i ansible/hosts_prod \
          ansible/run_role.yml \
          -e "role_name=$${ROLE}" \
          -e "target_hosts=$${TARGET}"