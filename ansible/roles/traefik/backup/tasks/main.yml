---

#------------------------------------------Traefik backup------------------------------------------

- name: Create .sops.yaml
  ansible.builtin.copy:
    dest: /home/docker/certs/traefik/.sops.yaml
    owner: root
    group: root
    mode: '0600'
    content: |
      creation_rules:
        - age:
            - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMy5WqCB0OqW9WuzzHWVegy5oWFH1tRBZALxKOvkr8GB jenkins@control

- name: Create Traefik backup directory on the control node
  ansible.builtin.file:
    path: "{{ traefik_backup_dir }}"
    state: directory
    mode: '0700'
  delegate_to: control_node

- name: Create .sops.yaml on backup host
  ansible.builtin.copy:
    dest: "{{ traefik_backup_dir }}/.sops.yaml"
    owner: root
    group: root
    mode: '0600'
    content: |
      creation_rules:
        - age:
            - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMy5WqCB0OqW9WuzzHWVegy5oWFH1tRBZALxKOvkr8GB jenkins@control
  delegate_to: control_node

- name: Generate timestamp
  ansible.builtin.set_fact:
    backup_time: "{{ lookup('pipe', 'date +%d_%m_%Y_%H_%M') }}"

- name: Check acme.json exists
  ansible.builtin.stat:
    path: /home/docker/certs/traefik/acme.json
  register: acme_json_stat

- name: Encrypt acme.json
  ansible.builtin.shell: >
    sops -e --input-type json acme.json > acme_{{ backup_time }}.json.enc
  args:
    chdir: /home/docker/certs/traefik
  when: acme_json_stat.stat.exists

- name: Fetch encrypted acme.json to the CI container
  ansible.builtin.fetch:
    src: "/home/docker/certs/traefik/acme_{{ backup_time }}.json.enc"
    dest: "/tmp/"
    flat: true
  when: acme_json_stat.stat.exists

- name: Copy encrypted acme.json to the control node
  ansible.builtin.copy:
    src: "/tmp/acme_{{ backup_time }}.json.enc"
    dest: "{{ traefik_backup_dir }}/acme_{{ backup_time }}.json.enc"
    mode: '0600'
  delegate_to: control_node
  when: acme_json_stat.stat.exists

- name: Remove remote encrypted acme.json
  ansible.builtin.file:
    path: "/home/docker/certs/traefik/acme_{{ backup_time }}.json.enc"
    state: absent
  when: acme_json_stat.stat.exists

- name: Find all acme.json backups
  ansible.builtin.find:
    paths: "{{ traefik_backup_dir }}"
    patterns: "acme_*.json.enc"
    file_type: file
  register: all_backups
  delegate_to: control_node
  when: acme_json_stat.stat.exists

- name: Remove old acme.json backups
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ (all_backups.files | sort(attribute='mtime'))[:-traefik_backup_keep | int] }}"
  when: acme_json_stat.stat.exists and all_backups.matched | int > traefik_backup_keep | int
  delegate_to: control_node

#------------------------------------------ACME-DNS backup------------------------------------------

- name: Create .sops.yaml
  ansible.builtin.copy:
    dest: /home/docker/.sops.yaml
    owner: root
    group: root
    mode: '0600'
    content: |
      creation_rules:
        - age:
            - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMy5WqCB0OqW9WuzzHWVegy5oWFH1tRBZALxKOvkr8GB jenkins@control

- name: Check acme-dns data and db exist
  ansible.builtin.stat:
    path: "{{ item }}"
  register: acme_dns_stats
  loop:
    - /home/docker/acme-dns/data
    - /home/docker/acme-dns/acme-dns.db

- name: Set acme-dns backup flag
  ansible.builtin.set_fact:
    acme_dns_exists: "{{ acme_dns_stats.results | map(attribute='stat.exists') | select('equalto', true) | list | length == 2 }}"

- name: Archive acme-dns data directory and database file
  ansible.builtin.archive:
    path:
      - /home/docker/acme-dns/data
      - /home/docker/acme-dns/acme-dns.db
    dest: /home/docker/acme-dns_{{ backup_time }}.tar.gz
    format: gz
    remove: no
  when: acme_dns_exists

- name: Encrypt acme-dns archive with SOPS
  ansible.builtin.shell: >
    sops -e --input-type binary --output-type binary acme-dns_{{ backup_time }}.tar.gz > acme-dns_{{ backup_time }}.tar.gz.enc
  args:
    chdir: /home/docker
  when: acme_dns_exists

- name: Fetch encrypted acme-dns backup to the CI container
  ansible.builtin.fetch:
    src: "/home/docker/acme-dns_{{ backup_time }}.tar.gz.enc"
    dest: "/tmp/"
    flat: true
  when: acme_dns_exists

- name: Copy encrypted acme-dns backup to the control node
  ansible.builtin.copy:
    src: "/tmp/acme-dns_{{ backup_time }}.tar.gz.enc"
    dest: "{{ traefik_backup_dir }}/acme-dns_{{ backup_time }}.tar.gz.enc"
    mode: '0600'
  delegate_to: control_node
  when: acme_dns_exists

- name: Remove remote encrypted acme-dns backup
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /home/docker/acme-dns_{{ backup_time }}.tar.gz.enc
    - /home/docker/acme-dns_{{ backup_time }}.tar.gz
  when: acme_dns_exists

- name: Find all acme-dns backups
  ansible.builtin.find:
    paths: "{{ traefik_backup_dir }}"
    patterns: "acme-dns_*.tar.gz.enc"
    file_type: file
  register: all_backups
  delegate_to: control_node
  when: acme_dns_exists

- name: Remove old acme-dns backups
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ (all_backups.files | sort(attribute='mtime'))[:-traefik_backup_keep | int] }}"
  when: acme_dns_exists and all_backups.matched | int > traefik_backup_keep | int
  delegate_to: control_node

#------------------------------------------Crowdsec backup------------------------------------------

- name: Define crowdsec paths
  set_fact:
    remote_archive: "/home/docker/crowdsec_{{ backup_time }}.tar.gz"
    remote_encrypted: "/home/docker/crowdsec_{{ backup_time }}.tar.gz.enc"

- name: Create .sops.yaml
  ansible.builtin.copy:
    dest: /home/docker/.sops.yaml
    owner: root
    group: root
    mode: '0600'
    content: |
      creation_rules:
        - age:
            - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMy5WqCB0OqW9WuzzHWVegy5oWFH1tRBZALxKOvkr8GB jenkins@control

- name: Check crowdsec directory exists
  ansible.builtin.stat:
    path: /home/docker/crowdsec
  register: crowdsec_stat

- name: Create archive of CrowdSec directory
  ansible.builtin.archive:
    path: /home/docker/crowdsec
    dest: "{{ remote_archive }}"
    format: gz
  when: crowdsec_stat.stat.exists

- name: Encrypt crowdsec archive with SOPS
  ansible.builtin.shell: >
    sops -e --input-type binary --output-type binary {{ remote_archive }} > {{ remote_encrypted }}
  args:
    chdir: /home/docker
  when: crowdsec_stat.stat.exists

- name: Fetch encrypted crowdsec backup to the CI container
  ansible.builtin.fetch:
    src: "{{ remote_encrypted }}"
    dest: /tmp/
    flat: true
  when: crowdsec_stat.stat.exists

- name: Copy encrypted crowdsec backup to the control node
  ansible.builtin.copy:
    src: "/tmp/crowdsec_{{ backup_time }}.tar.gz.enc"
    dest: "{{ traefik_backup_dir }}/crowdsec_{{ backup_time }}.tar.gz.enc"
    mode: '0600'
  delegate_to: control_node
  when: crowdsec_stat.stat.exists

- name: Remove remote unencrypted crowdsec archive
  ansible.builtin.file:
    path: "{{ remote_archive }}"
    state: absent
  when: crowdsec_stat.stat.exists

- name: Remove remote encrypted crowdsec archive
  ansible.builtin.file:
    path: "{{ remote_encrypted }}"
    state: absent
  when: crowdsec_stat.stat.exists

- name: Keep only last {{ traefik_backup_keep }} CrowdSec backups
  delegate_to: control_node
  ansible.builtin.shell: |
    ls -1t {{ traefik_backup_dir }}/crowdsec_*.tar.gz.enc 2>/dev/null | tail -n +{{ traefik_backup_keep + 1 }} | xargs -r rm -f
  when: crowdsec_stat.stat.exists
#------------------------------------------Authelia backup------------------------------------------

# Что здесь настоящее состояние (всё остальное восстанавливается из репозитория):
#   db.sqlite3                        — TOTP-сиды, WebAuthn/passkey, сессии,
#                                       regulation (баны), одноразовые коды;
#   secrets/storage_encryption_key    — БЕЗ него БД не расшифровать, т.е. бэкап БД
#                                       без ключа бесполезен — бэкапить только вместе;
#   secrets/session_secret            — иначе после восстановления все сессии невалидны;
#   secrets/reset_password_jwt_secret — флоу сброса пароля;
#   users_database.yml                — argon2-хеш пароля pi (в репо только шаблон + vault).
# configuration.yml не бэкапим (роль рендерит его из репозитория),
# notifications.txt — одноразовые уведомления, README.md — документация.

- name: Check authelia data directory exists
  ansible.builtin.stat:
    path: /home/docker/authelia
  register: authelia_stat

- name: Check authelia database exists
  ansible.builtin.stat:
    path: /home/docker/authelia/db.sqlite3
  register: authelia_db_stat
  when: authelia_stat.stat.exists

- name: Check authelia state files to back up
  ansible.builtin.stat:
    path: "{{ item }}"
  register: authelia_state_files
  loop:
    - /home/docker/authelia/secrets
    - /home/docker/authelia/users_database.yml
  when: authelia_stat.stat.exists

- name: Set authelia backup paths
  ansible.builtin.set_fact:
    authelia_stage: /home/docker/authelia-backup
    authelia_archive: "/home/docker/authelia_{{ backup_time }}.tar.gz"
    authelia_encrypted: "/home/docker/authelia_{{ backup_time }}.tar.gz.enc"

# staging пересоздаём каждый раз, чтобы в архив не попали файлы прошлого прогона.
- name: Recreate authelia staging directory
  ansible.builtin.file:
    path: "{{ authelia_stage }}"
    state: "{{ item }}"
    owner: root
    group: root
    mode: '0700'
  loop:
    - absent
    - directory
  when: authelia_stat.stat.exists

# Онлайн-снимок sqlite (backup API учитывает WAL): копировать db.sqlite3 на ходу
# нельзя — Authelia пишет в WAL, получится битый или устаревший файл.
- name: Make consistent sqlite snapshot of authelia database
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import sqlite3, sys
        src, dst = sys.argv[1], sys.argv[2]
        with sqlite3.connect(src) as s, sqlite3.connect(dst) as d:
            s.backup(d)
      - /home/docker/authelia/db.sqlite3
      - "{{ authelia_stage }}/db.sqlite3"
  when: authelia_db_stat.stat.exists
  changed_when: false

- name: Copy authelia secrets and users database to staging
  ansible.builtin.copy:
    src: "{{ item.stat.path }}"
    dest: "{{ authelia_stage }}/{{ item.stat.path | basename }}"
    remote_src: true
    owner: root
    group: root
    mode: '0600'
    directory_mode: '0700'
  loop: "{{ authelia_state_files.results | default([]) }}"
  when: item.stat.exists
  no_log: true

- name: Archive authelia state
  ansible.builtin.archive:
    path: "{{ authelia_stage }}"
    dest: "{{ authelia_archive }}"
    format: gz
    remove: no
  when: authelia_stat.stat.exists

- name: Encrypt authelia archive with SOPS
  ansible.builtin.shell: >
    sops -e --input-type binary --output-type binary {{ authelia_archive }} > {{ authelia_encrypted }}
  args:
    chdir: /home/docker
  when: authelia_stat.stat.exists

- name: Fetch encrypted authelia backup to the CI container
  ansible.builtin.fetch:
    src: "{{ authelia_encrypted }}"
    dest: /tmp/
    flat: true
  when: authelia_stat.stat.exists

- name: Copy encrypted authelia backup to the control node
  ansible.builtin.copy:
    src: "/tmp/authelia_{{ backup_time }}.tar.gz.enc"
    dest: "{{ traefik_backup_dir }}/authelia_{{ backup_time }}.tar.gz.enc"
    mode: '0600'
  delegate_to: control_node
  when: authelia_stat.stat.exists

- name: Remove authelia staging and archives from the traefik host
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ authelia_stage }}"
    - "{{ authelia_archive }}"
    - "{{ authelia_encrypted }}"
  when: authelia_stat.stat.exists

- name: Keep only last {{ traefik_backup_keep }} Authelia backups
  delegate_to: control_node
  ansible.builtin.shell: |
    ls -1t {{ traefik_backup_dir }}/authelia_*.tar.gz.enc 2>/dev/null | tail -n +{{ traefik_backup_keep + 1 }} | xargs -r rm -f
  when: authelia_stat.stat.exists
