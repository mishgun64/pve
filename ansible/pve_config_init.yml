---

- name: PVE config
  hosts: pve
  remote_user: root
  gather_facts: false
  vars:
    # Используется ТОЛЬКО при первичной настройке PVE (bootstrap): роль
    # pve/config_soft сразу ставит authorized_keys2 и меняет пароль root,
    # дальнейшие прогоны идут по ключу. Пароль на хостах сменить.
    ansible_password: "12345678"
  roles:
    - pve/config_soft
    - pve/firewall
    - pve/config_hard
    - pve/firstboot_clean
    - pve/get_api_token
