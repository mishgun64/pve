---

###############################################################
# Authelia — 2FA для pi.mishgun.com
#
# Секреты НЕ хранятся в этом файле: они генерируются ролью на хосте в
# /home/docker/authelia/secrets (0600, владелец docker) и передаются через
# переменные *_FILE (AUTHELIA_..._FILE) в docker-compose.yml.
# Хеш пароля пользователя рендерится в users_database.yml из vault
# (vault_authelia_pi_password_hash).
###############################################################

theme: 'dark'

server:
  address: 'tcp://:9091'
  # Ключа server.headers.trusted_proxies в Authelia НЕТ (в 4.38/4.39
  # server.headers умеет только csp_template). Authelia доверяет
  # X-Forwarded-* от любого, кто до неё достучался, поэтому защита строится
  # снаружи: порт 9091 не публикуется, контейнер живёт только в сети proxy,
  # а вход один — Traefik (он сам выставляет X-Forwarded-*).
  endpoints:
    authz:
      forward-auth:
        implementation: 'ForwardAuth'

log:
  level: 'info'
  format: 'text'

# Второй фактор: TOTP (Google Authenticator/Aegis/1Password и т.п.).
# Секреты TOTP создаются при первичной регистрации устройства в портале.
totp:
  issuer: 'mishgun.com'
  period: 30
  skew: 1

authentication_backend:
  file:
    path: '/config/users_database.yml'
    watch: false
    password:
      algorithm: 'argon2'
      argon2:
        variant: 'argon2id'
        iterations: 3
        memory: 65536
        parallelism: 4
        key_length: 32
        salt_length: 16
  # Нет SMTP — сброс пароля отключён, пароль меняется на хосте (см. README роли).
  password_reset:
    disable: true

access_control:
  # Всё, что не описано явно, — запрещено.
  default_policy: 'deny'
  rules:
    - domain: 'pi.mishgun.com'
      policy: 'two_factor'
      subject:
        - 'group:admins'

session:
  name: 'authelia_session'
  # session.storage нет с 4.39: без блока redis сессии пишутся в локальную
  # sqlite (/config/db.sqlite3, тот же файл, что storage.local). Redis не нужен.
  expiration: '12 hours'
  inactivity: '1 hour'
  # remember_me отключён: для админского UI каждые 12 часов нужен полный вход.
  # ВАЖНО: именно число -1, без кавычек. Строка '-1' в 4.39 не парсится
  # ("could not decode '-1' to a time.Duration") и Authelia падает с
  # configuration error -> крэш-луп и 502/504 на login.mishgun.com.
  remember_me: -1
  cookies:
    - domain: 'mishgun.com'
      authelia_url: 'https://login.mishgun.com'
      default_redirection_url: 'https://pi.mishgun.com'
      same_site: 'lax'

# Анти-брутфорс: 5 неудач за 2 минуты -> бан 15 минут.
regulation:
  max_retries: 5
  find_time: '2 minutes'
  ban_time: '15 minutes'

storage:
  local:
    path: '/config/db.sqlite3'

notifier:
  filesystem:
    filename: '/config/notifications.txt'

# identity_validation.reset_password.jwt_secret НЕ задаётся здесь: значение
# приходит только из env
# AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE
# (/config/secrets/reset_password_jwt_secret).
